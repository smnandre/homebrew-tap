name: brew test-bot

on:
  pull_request:

jobs:
  cask:
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Clean taps
        run: |
          for TAP in aws/tap hashicorp/tap; do
            if brew tap | grep -qx "$TAP"; then
              brew untap --force "$TAP"
            fi
          done

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate casks
        run: |
          set -euo pipefail
          CURRENT_CASK=""
          cleanup() {
            if [ -n "$CURRENT_CASK" ] && brew list --cask "$CURRENT_CASK" > /dev/null 2>&1; then
              brew uninstall --cask "$CURRENT_CASK"
            fi
          }
          trap cleanup EXIT
          for CASK_FILE in Casks/*.rb; do
            TOKEN=$(basename "$CASK_FILE" .rb)
            CURRENT_CASK="smnandre/tap/$TOKEN"
            brew trust --cask "$CURRENT_CASK"
            brew style --cask "$CURRENT_CASK"
            brew audit --strict --online --cask "$CURRENT_CASK"
            brew install --cask "$CURRENT_CASK"
            INFO=$(brew info --json=v2 --cask "$CURRENT_CASK")
            CASK_VERSION=$(ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("casks").first.fetch("version")' <<< "$INFO")
            APP_NAME=$(ruby -rjson -e '
              c = JSON.parse(STDIN.read).fetch("casks").first
              puts c.fetch("artifacts").find { |artifact| artifact.key?("app") }.fetch("app").first
            ' <<< "$INFO")
            BUNDLE_ID=$(ruby -rjson -e '
              c = JSON.parse(STDIN.read).fetch("casks").first
              uninstall = c.fetch("artifacts").find { |artifact| artifact.key?("uninstall") }
              puts uninstall.fetch("uninstall").first.fetch("quit")
            ' <<< "$INFO")
            APP="/Applications/$APP_NAME"
            PLIST="$APP/Contents/Info.plist"
            EXECUTABLE=$(plutil -extract CFBundleExecutable raw -o - "$PLIST")
            file "$APP/Contents/MacOS/$EXECUTABLE" | grep 'arm64'
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")" = "$CASK_VERSION"
            test "$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")" = "$BUNDLE_ID"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign --display --verbose=4 "$APP" 2>&1 | grep 'Authority=Developer ID Application:'
            codesign --display --verbose=4 "$APP" 2>&1 | grep 'TeamIdentifier=3D8DYUPC57'
            spctl --assess --type execute --verbose=2 "$APP"
            brew uninstall --cask "$CURRENT_CASK"
            CURRENT_CASK=""
          done

  merge:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.cask.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.user.login == 'smnandre'
    needs: cask
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
